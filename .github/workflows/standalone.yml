# Builds the standalone simem binaries (no Node.js needed on the user's
# machine) for each platform and attaches them, with SHA256SUMS, to the
# GitHub release. A single-executable binary only runs on the OS/CPU it was
# built on, hence the matrix.
name: standalone binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # darwin-arm64
          - os: macos-13        # darwin-x64
          - os: ubuntu-24.04    # linux-x64
          - os: ubuntu-24.04-arm # linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm install --no-save postject@1.0.0-alpha.6
      - run: node scripts/build-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: simem-${{ matrix.os }}
          path: build/standalone/simem-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-binaries
          merge-multiple: true
      - name: Checksums
        run: cd dist-binaries && sha256sum simem-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-binaries/* scripts/install.sh --clobber
